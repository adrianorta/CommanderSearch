<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MTG Filter — Commander colors &amp; types</title>
  <link rel="preconnect" href="https://api.scryfall.com" />
  <link rel="preconnect" href="https://cards.scryfall.io" />
  <link rel="preconnect" href="https://svgs.scryfall.io" />
  <style>
    :root {
      --bg: #0c0e12;
      --panel: #14181f;
      --raised: #1b212b;
      --line: #2a3140;
      --text: #eef2f7;
      --muted: #8b95a5;
      --accent: #c9c4b8;
      --accent-2: #c9c4b8;
      --accent-glow: rgba(201, 196, 184, 0.4);
      --accent-soft: #2a2c30;
      --w: #f8f6d8;
      --u: #64a7e8;
      --b: #8a7ca8;
      --r: #e06a55;
      --g: #5caf6e;
      --c: #c9c4b8;
      --danger: #ef6b6b;
      --rail: 320px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      display: grid;
      grid-template-columns: var(--rail) minmax(0, 1fr);
      min-height: 100vh;
    }
    .rail {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 20px 16px 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }
    .stage { padding: 20px 24px 48px; }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin: 0;
    }
    .brand span { color: var(--muted); font-size: 0.75rem; }

    .sec {
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }
    .sec:first-of-type { border-top: 0; }

    label.field {
      display: block;
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .field-row .field { margin: 0; }

    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    input[type="text"], select {
      width: 100%;
      background: var(--raised);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.88rem;
      outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }

    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      width: 124px;
      height: 32px;
      padding: 2px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--muted);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .mode-toggle::before {
      content: "";
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 2px;
      width: calc(50% - 2px);
      border-radius: 999px;
      background: var(--accent-soft);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 12px var(--accent-glow);
      transition: transform 0.18s ease;
    }
    .mode-toggle.is-any::before { transform: translateX(100%); }
    .mode-toggle.thirds {
      width: 248px;
      grid-template-columns: 1fr 1fr 1fr 1fr;
    }
    .mode-toggle.thirds::before { width: calc(25% - 2px); }
    .mode-toggle.thirds[data-mode="identity"]::before { transform: translateX(100%); }
    .mode-toggle.thirds[data-mode="inside"]::before { transform: translateX(200%); }
    .mode-toggle.thirds[data-mode="exact"]::before { transform: translateX(300%); }
    .mode-toggle span {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
    }
    .mode-toggle[data-mode="and"] span:first-child,
    .mode-toggle[data-mode="or"] span:last-child,
    .mode-toggle[data-mode="having"] span:first-child,
    .mode-toggle[data-mode="identity"] span:nth-child(2),
    .mode-toggle[data-mode="inside"] span:nth-child(3),
    .mode-toggle[data-mode="exact"] span:last-child {
      color: #dce9ff;
    }

    .cmc-slider { display: grid; gap: 6px; }
    .cmc-slider-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .cmc-value {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
    }
    .cmc-hint {
      color: var(--muted);
      font-size: 0.68rem;
    }
    .cmc-pad {
      position: relative;
      height: 84px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--raised);
      touch-action: none;
      user-select: none;
    }
    .cmc-pad.held { border-color: var(--accent); }
    .cmc-rail {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 50%;
      height: 6px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: var(--line);
      pointer-events: none;
    }
    .cmc-window {
      position: absolute;
      top: 50%;
      height: 28px;
      min-width: 28px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 70%, #1b212b);
      box-shadow: 0 0 0 3px var(--accent-glow);
      pointer-events: none;
    }
    .cmc-ticks {
      display: flex;
      justify-content: space-between;
      padding: 0 14px;
      color: var(--muted);
      font-size: 0.68rem;
      font-variant-numeric: tabular-nums;
    }
    .cmc-desk { display: none; }
    .cmc-scale {
      display: flex;
      gap: 3px;
    }
    .cmc-tick {
      flex: 1;
      min-width: 0;
      height: 34px;
      padding: 0;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      font-size: 0.72rem;
      font-weight: 650;
    }
    .cmc-tick.span {
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
      color: #c5d8f5;
    }
    .cmc-tick.on {
      background: color-mix(in srgb, var(--accent) 70%, #1b212b);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .cmc-desk-hint {
      color: var(--muted);
      font-size: 0.68rem;
    }

    button, .chip, .kw-pad, .mana, .cmc-tick {
      -webkit-tap-highlight-color: transparent;
    }
    button:focus, .chip:focus, .kw-pad:focus, .mana:focus, .cmc-tick:focus {
      outline: none;
    }
    button:focus-visible, .chip:focus-visible, .kw-pad:focus-visible {
      box-shadow: 0 0 0 2px var(--accent-glow), 0 0 16px var(--accent-glow);
    }
    button, .chip {
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 9px;
      cursor: pointer;
      font: inherit;
      font-size: 0.78rem;
    }
    button.primary {
      background: color-mix(in srgb, var(--accent) 35%, #2f3540);
      border-color: color-mix(in srgb, var(--accent) 45%, #5a6270);
      color: #fff;
      width: 100%;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 650;
    }
    button.ghost {
      width: 100%;
      border-radius: 8px;
      padding: 8px;
      background: transparent;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .actions {
      display: grid;
      gap: 8px;
      padding: 12px 0 4px;
      margin-top: auto;
      position: sticky;
      bottom: 0;
      background: linear-gradient(180deg, transparent, var(--panel) 18%);
    }

    .mana {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 0;
      opacity: 0.32;
      filter: grayscale(0.5);
    }
    .mana img { width: 22px; height: 22px; display: block; }
    .mana.on { opacity: 1; filter: none; }
    .mana[data-c="W"].on { box-shadow: 0 0 0 2px var(--w); }
    .mana[data-c="U"].on { box-shadow: 0 0 0 2px var(--u); }
    .mana[data-c="B"].on { box-shadow: 0 0 0 2px var(--b); }
    .mana[data-c="R"].on { box-shadow: 0 0 0 2px var(--r); }
    .mana[data-c="G"].on { box-shadow: 0 0 0 2px var(--g); }
    .mana[data-c="C"].on { box-shadow: 0 0 0 2px var(--c); }

    .types, .keywords { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      min-height: 36px;
      padding: 8px 12px;
      font-size: 0.8rem;
      touch-action: manipulation;
    }
    .chip.on {
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 75%, #fff);
      color: #f4f8ff;
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent),
        0 0 12px var(--accent-glow),
        0 0 24px color-mix(in srgb, var(--accent-2) 28%, transparent);
    }
    .chip.exclude {
      background: color-mix(in srgb, var(--danger) 18%, var(--raised));
      border-color: color-mix(in srgb, var(--danger) 80%, #fff);
      color: #ffd0d0;
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--danger) 35%, transparent),
        0 0 12px color-mix(in srgb, var(--danger) 40%, transparent),
        0 0 24px color-mix(in srgb, var(--danger) 22%, transparent);
    }

    .kw-list { display: grid; gap: 10px; }
    .kw-pads {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .kw-pad {
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 400;
      line-height: 1.15;
      text-align: center;
      text-transform: none;
      touch-action: manipulation;
    }
    .kw-pad.on {
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 75%, #fff);
      color: #f4f8ff;
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent),
        0 0 12px var(--accent-glow),
        0 0 24px color-mix(in srgb, var(--accent-2) 28%, transparent);
    }
    .kw-pad.has {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    }
    .kw-pad .kw-count {
      min-width: 1.15em;
      height: 1.15em;
      padding: 0 4px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 70%, #1b212b);
      color: #fff;
      font-size: 0.62rem;
      line-height: 1.15em;
    }
    .kw-pad .kw-count:empty { display: none; }
    .kw-panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--raised);
      padding: 10px;
    }
    .kw-panel[hidden] { display: none; }
    .kw-panel-title {
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .query {
      margin-top: 10px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.68rem;
      color: #7f8b9c;
      line-height: 1.35;
      word-break: break-word;
    }


    .builder {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, #14181f), #10141b 42%);
      border-radius: 16px;
      padding: 14px 14px 12px;
      margin-bottom: 16px;
    }
    .builder-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
    .builder-kicker { font-size:0.64rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
    .builder-read { color:var(--text); font-size:0.92rem; font-weight:550; letter-spacing:-0.02em; line-height:1.35; }
    .builder-read span.mute { color:var(--muted); font-weight:450; }
    .builder-read span.or { color:#e7c37a; }
    .builder-read span.not { color:#ffb3b3; }
    .builder-bar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:10px 0 8px; }
    .builder-title { font-size:0.64rem; font-weight:650; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
    .builder-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .builder-actions button { border-radius:10px; padding:6px 10px; font-size:0.72rem; font-weight:700; }
    .builder-actions button.on { border-color:var(--accent); background:var(--accent-soft); color:#dce9ff; }
    .builder-actions button.warn { border-color:color-mix(in srgb, var(--danger) 55%, var(--line)); color:#ffd0d0; }
    .builder-actions button:disabled { opacity:0.38; }
    .parts { display:flex; flex-wrap:wrap; gap:6px; min-height:42px; padding:4px; border-radius:10px; }
    .workspace {
      display:flex; flex-wrap:wrap; align-items:center; gap:7px;
      min-height:88px; padding:12px; border-radius:14px;
      border:1px solid var(--line); background:#0b0e13;
    }
    .workspace.focused { border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
    .box {
      display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px;
      padding:7px 8px 7px 6px; border-radius:12px; min-height:42px; cursor:pointer;
      border:1px solid color-mix(in srgb, var(--accent) 38%, var(--line));
      background:color-mix(in srgb, var(--accent) 8%, #151b24);
    }
    .box.or-box { border-color:color-mix(in srgb, #d4a24c 55%, var(--line)); background:color-mix(in srgb, #d4a24c 9%, #151b24); }
    .box.not-box { border-color:color-mix(in srgb, var(--danger) 60%, var(--line)); background:color-mix(in srgb, var(--danger) 9%, #151b24); }
    .box.focused { box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
    .paren { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:1.15rem; font-weight:650; color:#6f7b8c; line-height:1; padding:0 2px; }
    .not-box .paren { color:#ef9a9a; }
    .or-box .paren { color:#c9a45d; }
    .join { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:0.68rem; font-weight:700; color:#8aa4c4; }
    .join.or { color:#e7c37a; }
    .join.need {
      min-width:22px; min-height:18px; border:1px dashed color-mix(in srgb, var(--accent) 40%, var(--line));
      border-radius:6px; color:#6f7b8c; background:#0b0e13;
    }
    .expr-empty { color:var(--muted); font-size:0.8rem; padding:4px 2px; }
    .builder, .parts, .workspace, .leaf, .box, .builder-actions button {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body.builder-dragging { overflow: hidden; overscroll-behavior: none; }
    .leaf {
      display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line);
      background:var(--raised); color:var(--text); border-radius:999px;
      padding:6px 8px 6px 10px; font:inherit; font-size:0.78rem; cursor:grab;
    }
    .leaf.on { background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 75%, #fff); color:#f4f8ff; }
    .leaf.not { background:color-mix(in srgb, var(--danger) 16%, var(--raised)); border-color:color-mix(in srgb, var(--danger) 75%, #fff); color:#ffd0d0; }
    .leaf.picked { box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent); }
    .leaf.type { border-radius:8px; }
    .leaf .mini { width:18px; height:18px; padding:0; border:0; border-radius:50%; background:transparent; color:var(--muted); font-size:0.85rem; display:grid; place-items:center; }
    .builder-scry { margin-top:8px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:0.7rem; color:#7f8b9c; line-height:1.4; word-break:break-word; }
    .builder-hint { color:var(--muted); font-size:0.72rem; margin-top:6px; line-height:1.4; }
    .drag-ghost {
      position:fixed; z-index:80; pointer-events:none; padding:6px 10px; border-radius:999px;
      background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 80%, #fff);
      color:#f4f8ff; font-size:0.78rem; font-weight:650; box-shadow:0 10px 30px #0008;
      transform:translate(-20px,-16px);
    }
    .is-dragging { opacity:0.35; }
    .drop-on { outline:2px solid color-mix(in srgb, var(--accent) 75%, #fff); outline-offset:2px; }
    .parts.drop-on { background:color-mix(in srgb, var(--accent) 8%, transparent); }
    .drop-slot { width:4px; align-self:stretch; min-height:24px; border-radius:99px; background:var(--accent); }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .status { color: var(--muted); font-size: 0.88rem; }
    .status.error { color: var(--danger); }
    .view-opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .view-opts select { width: 100%; min-width: 0; }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      aspect-ratio: 488 / 680;
      object-fit: cover;
      background: #111;
      display: block;
    }
    .meta { padding: 7px 8px 9px; }
    .name { font-size: 0.8rem; font-weight: 650; line-height: 1.25; }
    .type { color: var(--muted); font-size: 0.7rem; margin-top: 2px; }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 64px 12px;
    }
    .empty-title {
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 650;
      margin-bottom: 8px;
    }
    .empty-hint {
      max-width: 28em;
      margin: 0 auto;
      line-height: 1.45;
    }
    .more-wrap { display: flex; justify-content: center; margin-top: 20px; }
    .credit {
      margin: 28px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .kw-sheet {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
    }
    .kw-sheet.open { display: block; }
    .kw-sheet-back {
      position: absolute;
      inset: 0;
      background: #00000088;
    }
    .kw-sheet-card {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 76vh;
      overflow: auto;
      background: var(--panel);
      border-radius: 18px 18px 0 0;
      border-top: 1px solid var(--line);
      padding: 0 16px 28px;
      touch-action: pan-y;
      transition: transform 0.2s ease;
    }
    .kw-sheet-card.dragging { transition: none; }
    .kw-sheet-bar {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0 12px;
      background: var(--panel);
    }
    .kw-sheet-bar h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .kw-sheet-close {
      position: relative;
      z-index: 2;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.35rem;
      line-height: 1;
      display: grid;
      place-items: center;
    }
    .kw-sheet-handle {
      width: 100%;
      height: 28px;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .kw-sheet-handle::after {
      content: "";
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: var(--line);
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .rail {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .kw-panel { display: none !important; }
      .workspace { min-height: 128px; padding: 16px; }
      .parts { min-height: 52px; }
      .leaf { padding: 8px 10px 8px 12px; font-size: 0.84rem; }
      .box { min-height: 48px; }
      .builder-actions button { min-height: 36px; padding: 8px 12px; }
      .drag-ghost { font-size: 0.9rem; padding: 8px 14px; }
    }

    @media (min-width: 901px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .rail {
        position: relative;
        height: auto;
        overflow: visible;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        display: grid;
        grid-template-columns: minmax(280px, 320px) minmax(280px, 1fr) minmax(260px, 340px) 240px;
        grid-template-areas:
          "brand brand brand brand"
          "id type cmc actions"
          "sub kw kw kw"
          "query query query query";
        gap: 12px 16px;
        padding: 20px 28px 16px;
        align-items: stretch;
      }
      .brand {
        grid-area: brand;
        margin: 0;
        justify-content: flex-start;
        align-items: baseline;
        gap: 10px;
        padding-bottom: 4px;
      }
      h1 { font-size: 1.22rem; }
      .sec,
      .sec:first-of-type {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--raised);
        min-width: 0;
        padding: 12px 14px;
      }
      .sec-id { grid-area: id; }
      .sec-id .row { flex-wrap: nowrap; }
      .sec-type { grid-area: type; }
      .sec-cmc { grid-area: cmc; }
      .cmc-slider { display: none; }
      .cmc-desk { display: grid; gap: 8px; }
      .sec-sub { grid-area: sub; }
      .sec-kw { grid-area: kw; }
      .actions {
        grid-area: actions;
        position: static;
        margin: 0;
        padding: 12px 14px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 12px;
        align-self: stretch;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 8px;
      }
      .actions .primary { margin-top: auto; }
      .actions .view-opts { grid-template-columns: 1fr; }
      .query {
        grid-area: query;
        margin: 0;
        padding: 0 4px;
        align-self: center;
        font-size: 0.72rem;
      }
      .kw-panel { margin-top: 8px; }
      .kw-sheet { display: none !important; }
      .stage {
        padding: 24px 28px 64px;
        background:
          radial-gradient(ellipse at top, var(--panel) 0%, var(--bg) 55%);
      }
      .topbar { margin-bottom: 20px; }
      .status { font-size: 0.95rem; }
      .results {
        grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
        gap: 16px;
      }
      .card { border-radius: 12px; }
      .meta { padding: 10px 11px 12px; }
      .name { font-size: 0.88rem; }
      .type { font-size: 0.74rem; }
      .empty { padding: 48px 12px; font-size: 1rem; }
      .more-wrap button {
        min-width: 180px;
        border-radius: 10px;
        padding: 10px 18px;
      }
    }

    @media (min-width: 1400px) {
      .rail {
        grid-template-columns: minmax(280px, 320px) minmax(360px, 1fr) minmax(300px, 380px) 260px;
        padding: 24px 40px 20px;
        gap: 14px 18px;
      }
      .stage { padding: 28px 40px 80px; }
      .results {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }
    }

    @media (hover: hover) and (min-width: 901px) {
      .chip:hover,
      .kw-pad:hover,
      .mana:hover,
      .mode-toggle:hover,
      .card:hover {
        border-color: color-mix(in srgb, var(--accent) 65%, var(--line));
      }
      .kw-pad:hover,
      .chip:hover {
        background: var(--accent-soft);
      }
      .card {
        transition: transform 0.16s ease, border-color 0.16s ease;
      }
      .card:hover { transform: translateY(-4px); }
      button.primary:hover {
        background: color-mix(in srgb, var(--accent) 50%, #2f3540);
      }
      button.ghost:hover { background: var(--raised); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <h1>Commander Filter</h1>
      </div>

      <section class="sec sec-id">
        <div class="field-row">
          <label class="field">Identity</label>
          <button type="button" class="mode-toggle thirds" id="idMode" data-mode="identity" aria-label="Color filter mode">
            <span data-pick="having">Having</span>
            <span data-pick="identity">Identity</span>
            <span data-pick="inside">Within</span>
            <span data-pick="exact">Exact</span>
          </button>
        </div>
        <div class="row" id="colors">
          <button class="mana" data-c="W" title="White" aria-pressed="false"><img alt="W" src="https://svgs.scryfall.io/card-symbols/W.svg" /></button>
          <button class="mana" data-c="U" title="Blue" aria-pressed="false"><img alt="U" src="https://svgs.scryfall.io/card-symbols/U.svg" /></button>
          <button class="mana" data-c="B" title="Black" aria-pressed="false"><img alt="B" src="https://svgs.scryfall.io/card-symbols/B.svg" /></button>
          <button class="mana" data-c="R" title="Red" aria-pressed="false"><img alt="R" src="https://svgs.scryfall.io/card-symbols/R.svg" /></button>
          <button class="mana" data-c="G" title="Green" aria-pressed="false"><img alt="G" src="https://svgs.scryfall.io/card-symbols/G.svg" /></button>
          <button class="mana" data-c="C" title="Colorless" aria-pressed="false"><img alt="C" src="https://svgs.scryfall.io/card-symbols/C.svg" /></button>
        </div>
      </section>

      <section class="sec sec-type">
        <label class="field">Type</label>
        <div class="types" id="types">
          <button class="chip" data-t="creature">Creature</button>
          <button class="chip" data-t="instant">Instant</button>
          <button class="chip" data-t="sorcery">Sorcery</button>
          <button class="chip" data-t="artifact">Artifact</button>
          <button class="chip" data-t="enchantment">Enchantment</button>
          <button class="chip" data-t="planeswalker">Planeswalker</button>
          <button class="chip" data-t="battle">Battle</button>
          <button class="chip" data-t="land">Land</button>
          <button class="chip" data-t="legendary">Legendary</button>
        </div>
      </section>

      <section class="sec sec-cmc">
        <div class="field-row">
          <label class="field">Mana value</label>
          <button type="button" class="chip" id="cmcAny">Any</button>
        </div>
        <div class="cmc-slider">
          <div class="cmc-slider-top">
            <span class="cmc-value" id="cmcValue">Any</span>
            <span class="cmc-hint">↕ size · ↔ move</span>
          </div>
          <div class="cmc-pad" id="cmcPad" role="slider" aria-label="Mana value range">
            <div class="cmc-rail"></div>
            <div class="cmc-window" id="cmcWindow"></div>
          </div>
          <div class="cmc-ticks">
            <span>0</span><span>5</span><span>10</span><span>15</span>
          </div>
        </div>
        <div class="cmc-desk" id="cmcDesk">
          <div class="cmc-scale" id="cmcScale"></div>
          <div class="cmc-desk-hint">Click one value, click another for a range.</div>
        </div>
      </section>

      <section class="sec sec-sub">
        <label class="field" for="subtypeQuery">Subtype</label>
        <input id="subtypeQuery" type="text" placeholder="elf, -human, aura" autocomplete="off" spellcheck="false" />
      </section>

      <section class="sec sec-kw">
        <div class="field-row">
          <label class="field">Keywords &amp; roles</label>
          <button type="button" class="mode-toggle" id="kwMode" data-mode="and" aria-label="Match all or any selected roles">
            <span data-kw-mode="and">All</span>
            <span data-kw-mode="or">Any</span>
          </button>
        </div>
        <div class="kw-list" id="keywords"></div>
      </section>

      <div class="actions">
        <div class="view-opts">
          <select id="sort" aria-label="Sort">
            <option value="edhrec" selected>EDHREC rank</option>
            <option value="name">Name</option>
            <option value="cmc">Mana value</option>
            <option value="released">Released</option>
            <option value="usd">Price</option>
          </select>
          <select id="unique" aria-label="Printings">
            <option value="cards" selected>One printing</option>
            <option value="prints">All printings</option>
            <option value="art">Unique art</option>
          </select>
        </div>
        <button id="searchBtn" class="primary">Search</button>
        <button id="clearBtn" class="ghost">Reset</button>
      </div>
      <div class="query" id="queryPreview">f:commander game:paper</div>
    </aside>

    <main class="stage">
      <div class="topbar">
        <div class="status" id="status">Set filters, then search.</div>
      </div>
      <div class="builder" id="builder">
        <div class="builder-head">
          <div class="builder-kicker">Scryfall match</div>
          <div class="builder-read" id="builderRead"><span class="mute">No extra match yet — identity and mana still apply.</span></div>
        </div>
        <div class="builder-bar">
          <div class="builder-title">Parts</div>
          <div class="builder-actions">
            <button type="button" id="placeAllBtn">Place all</button>
          </div>
        </div>
        <div class="parts" id="parts"></div>
        <div class="builder-bar">
          <div class="builder-title">Expression</div>
          <div class="builder-actions">
            <button type="button" id="addAndBtn">AND</button>
            <button type="button" id="addOrBtn">OR</button>
            <button type="button" id="addGroupBtn">( )</button>
            <button type="button" id="addNotBtn">NOT</button>
          </div>
        </div>
        <div class="workspace" id="workspace"></div>
        <div class="builder-scry" id="builderScry"></div>
        <div class="builder-hint" id="builderHint"></div>
      </div>
      <div class="results" id="results"></div>
      <div class="more-wrap">
        <button id="moreBtn" hidden>Load more</button>
      </div>
      <p class="credit">Powered by Scryfall</p>
    </main>
  </div>

  <div class="kw-sheet" id="kwSheet" hidden>
    <div class="kw-sheet-back" id="kwSheetBack"></div>
    <div class="kw-sheet-card" role="dialog" aria-modal="true" aria-labelledby="kwSheetTitle">
      <div class="kw-sheet-handle"></div>
      <div class="kw-sheet-bar">
        <h2 id="kwSheetTitle">Roles</h2>
        <button type="button" class="kw-sheet-close" id="kwSheetClose" aria-label="Close">×</button>
      </div>
      <div class="keywords" id="kwSheetBody"></div>
    </div>
  </div>

  <script>
    const COLORS = ["W", "U", "B", "R", "G"];
    const ALL_COLORS = [...COLORS, "C"];
    const CMC_MAX = 15;
    const ROLE_ITEMS = {
      "Mana": [
        ["Ramp", "otag:ramp"],
        ["Mana rock", "otag:mana-rock"],
        ["Mana dork", "otag:mana-dork"],
        ["Fast mana", "(cmc<=1 (otag:mana-rock or otag:ritual))"],
        ["Treasure", "(kw:treasure or o:treasure)"],
        ["Ritual", "otag:ritual"],
        ["Cost reduce", "(otag:cost-reduction or o:\"less to cast\")"],
      ],
      "Combat": [
        ["Extra combat", "otag:extra-combat"],
        ["Pump", "(otag:pump or otag:combat-pump or o:\"gets +\")"],

      ],
      "Protection": [

        ["Grant indestructible", "(otag:grants-indestructible or o:\"gain indestructible\" or o:\"gains indestructible\")"],

        ["Edict", "otag:edict"],
        ["Burn", "(otag:burn or otag:burn-creature or otag:burn-player or otag:burn-any)"],
        ["Counterspell", "(otag:counterspell or otag:counter)"],
        ["Stifle", "otag:stifle"],
        ["Bounce", "otag:bounce"],

      "Synergy": [

        ["Clone", "(otag:clone or otag:copy)"],
        ["Lifegain", "otag:lifegain"],
        ["Drain", "(otag:drain or otag:life-drain)"],
      ],
      "Card flow": [
        ["Draw", "(otag:draw or otag:card-advantage)"],
        ["Cantrip", "otag:cantrip"],
        ["Loot", "(otag:loot or otag:rummage)"],
        ["Impulse", "(otag:impulse or otag:impulse-draw)"],
        ["Wheel", "otag:wheel"],
        ["Discard", "otag:discard"],
        ["Mill", "otag:mill"],
        ["Self-mill", "(otag:self-mill or otag:mill-self)"],
        ["Scry", "kw:scry"],
        ["Surveil", "kw:surveil"],
        ["Tutor", "otag:tutor"],
        ["Recursion", "otag:recursion"],
        ["Reanimate", "otag:reanimate"],
      ],
      "Engines": [
        ["Tokens", "(otag:creates-tokens or o:token)"],
        ["+1/+1 counters", "(otag:\"+1/+1-counters\" or o:\"+1/+1\")"],
        ["Proliferate", "kw:proliferate"],
        ["Food", "(otag:food or kw:food)"],
        ["Clue", "(otag:clue or kw:clue)"],
        ["Blood", "(otag:blood or kw:blood)"],
        ["Copy", "(otag:copy or otag:clone)"],
        ["ETB", "(otag:etb or otag:etb-trigger or o:\"when ~ enters\")"],
        ["Dies", "(otag:dies-trigger or otag:death-trigger or o:dies)"],
        ["Cast trigger", "otag:cast-trigger"],
      ],
      "Politics": [
        ["Group hug", "otag:group-hug"],
        ["Monarch", "(otag:monarch or o:monarch)"],
        ["Initiative", "(otag:initiative or o:initiative)"],
        ["The Ring", "(otag:the-ring or o:\"the ring\" or o:\"ring tempts\")"],
      ],
      "Finishers": [
        ["Win the game", "(otag:win-the-game or o:\"win the game\")"],
        ["Lose the game", "(otag:lose-the-game or o:\"lose the game\")"],
        ["Extra turn", "otag:extra-turn"],
        ["Commander damage", "(otag:commander-damage or o:\"commander damage\")"],
        ["Poison", "(otag:poison or otag:infect or kw:infect or kw:toxic)"],
      ],
    };

    const KEYWORD_BUCKETS = {
      "Evasion": [
        "Flying","Reach","Menace","Shadow","Skulk","Fear","Intimidate","Horsemanship",
        "Landwalk","Forestwalk","Islandwalk","Mountainwalk","Swampwalk","Plainswalk",
        "Desertwalk","Nonbasic landwalk","Legendary landwalk"
      ],
      "Combat": [
        "Trample","Haste","Vigilance","Deathtouch","Lifelink","First strike","Double strike",
        "Defender","Prowess","Flanking","Bushido","Exalted","Battle Cry","Melee","Mentor",
        "Training","Enlist","Provoke","Banding","Double team","Frenzy","Afflict","Rampage",
        "Power-up","Riot","Unleash","Boast","Decayed","Dethrone","Max speed","Toxic","Infect",
        "Wither","Poisonous","Annihilator","Crew","Saddle","Station","Encore","Ninjutsu",
        "Commander ninjutsu","Dash","Blitz","Prowl","Sneak","Web-slinging"
      ],
      "Protection": [
        "Hexproof","Hexproof from","Shroud","Ward","Indestructible","Protection",
        "Umbra armor","Absorb"
      ],
      "Timing": [
        "Flash","Split second","Phasing","Vanishing","Fading","Suspend","Rebound",
        "Foretell","Plot","Warp","Hideaway","Daybound","Nightbound","Impending",
        "Morph","Megamorph","Disguise","Miracle","Fuse","Entwine","Splice","Read Ahead"
      ],
      "Mana": [
        "Affinity","Convoke","Delve","Improvise","Kicker","Multikicker","Emerge","Evoke",
        "Offering","Prototype","Compleated","Assist","Surge","Spectacle","Escalate",
        "Cumulative upkeep","Echo","Undaunted","Gift","Freerunning","Spree","Tiered",
        "Extort","Firebending","Cleave"
      ],
      "Attachments": [
        "Equip","Enchant","Fortify","Reconfigure","Bestow","Aura Swap"
      ],
      "Interaction": [
        "Overload"
      ],
      "Synergy": [
        "Exploit","Bargain","Casualty","Devour"
      ],
      "Card flow": [
        "Cycling","Typecycling","Landcycling","Basic landcycling","Plainscycling",
        "Islandcycling","Swampcycling","Mountaincycling","Forestcycling","Wizardcycling",
        "Slivercycling","Halflingcycling","Jump-start","Flashback",
        "Retrace","Buyback","Madness","Forecast","Transmute","Transfigure","Recover",
        "Scavenge","Embalm","Eternalize","Unearth","Escape","Disturb","Aftermath",
        "Harmonize","Mayhem","Dredge","Soulshift"
      ],
      "Engines": [
        "Living weapon","Living metal","Modular","Persist","Undying","Graft","Evolve",
        "Bloodthirst","Renown","Ravenous","Outlast","Backup","Fabricate","Afterlife",
        "Ripple","Replicate","Demonstrate","Myriad","Mutate","Craft","Offspring","Awaken",
        "Squad","Champion","Changeling","Conspire","Soulbond","Ascend","Ingest","Tribute",
        "Devoid","Augment","Haunt","For Mirrodin!","Specialize",
        "More Than Meets the Eye","Intensity","Sunburst","Amplify","Level Up","Reinforce",
        "Job select","Mobilize","Exhaust","Solved","Increment","Paradigm","Teamwork",
        "Storied","Cipher","Visit","Space sculptor"
      ],
      "Commander": [
        "Partner","Partner with","Friends forever","Doctor's companion","Choose a background",
        "Companion","Hidden agenda","Double agenda"
      ],
      "Finishers": [
        "Storm","Gravestorm","Epic","Cascade"
      ],
    };

    const GROUP_ORDER = [
      "Mana",
      "Combat",
      "Evasion",
      "Protection",
      "Timing",
      "Interaction",
      "Synergy",
      "Card flow",
      "Engines",
      "Politics",
      "Attachments",
      "Commander",
      "Finishers",
      "Ability words",
    ];

    function kwQuery(name) {
      const key = String(name).toLowerCase();
      const quoted = /[\s\-!]/.test(key);
      const kw = quoted ? 'kw:"' + key + '"' : "kw:" + key;
      const oracle = quoted ? 'o:"' + key + '"' : "o:" + key;
      return "(" + kw + " or " + oracle + ")";
    }

    const KEYWORD_CATEGORY = {};
    Object.entries(KEYWORD_BUCKETS).forEach(([label, names]) => {
      names.forEach((name) => { KEYWORD_CATEGORY[name.toLowerCase()] = label; });
    });

    function categorizeKeyword(name) {
      const key = String(name).toLowerCase();
      if (KEYWORD_CATEGORY[key]) return KEYWORD_CATEGORY[key];
      if (key.includes("cycling")) return "Card flow";
      if (key.includes("walk") || key.includes("flying") || key.includes("menace") || key.includes("skulk")) return "Evasion";
      if (key.includes("hexproof") || key.includes("protection") || key.includes("ward") || key.includes("shroud")) return "Protection";
      if (key.includes("flash") || key.includes("morph") || key.includes("bound") || key.includes("suspend") || key.includes("foretell") || key.includes("warp")) return "Timing";
      if (key.includes("partner") || key.includes("companion") || key.includes("background") || key.includes("agenda")) return "Commander";
      if (key.includes("equip") || key.includes("enchant") || key.includes("bestow") || key.includes("fortify")) return "Attachments";
      if (key.includes("storm") || key.includes("epic") || key.includes("cascade")) return "Finishers";
      if (key.includes("ninjutsu") || key.includes("crew") || key.includes("saddle") || key.includes("trample") || key.includes("haste")) return "Combat";
      return "Engines";
    }

    function buildKeywordGroups() {
      const groups = GROUP_ORDER.map((label) => ({ label, items: [] }));
      const byLabel = Object.fromEntries(groups.map((g) => [g.label, g]));
      Object.entries(KEYWORD_BUCKETS).forEach(([label, names]) => {
        names.forEach((name) => {
          byLabel[label].items.push([name, kwQuery(name)]);
        });
      });
      Object.entries(ROLE_ITEMS).forEach(([label, items]) => {
        if (!byLabel[label]) return;
        byLabel[label].items = items.concat(byLabel[label].items);
      });
      byLabel["Ability words"].items = [
        ["Landfall","kw:landfall"],["Magecraft","kw:magecraft"],["Constellation","kw:constellation"],
        ["Morbid","kw:morbid"],["Metalcraft","kw:metalcraft"],["Threshold","kw:threshold"],
        ["Delirium","kw:delirium"],["Raid","kw:raid"],["Battalion","kw:battalion"],["Revolt","kw:revolt"],
        ["Eminence","kw:eminence"],["Undergrowth","kw:undergrowth"],["Coven","kw:coven"],
        ["Alliance","kw:alliance"],["Valiant","kw:valiant"],["Enrage","kw:enrage"],
      ];
      return groups;
    }

    const KEYWORD_GROUPS = buildKeywordGroups();

    const state = {
      colors: new Set(),
      kwOpen: null,
      kwMode: "and",
      idMode: "identity",
      cmcMin: 0,
      cmcMax: 15,
      next: null,
      total: 0,
      shown: 0,
      parts: [],
      tree: { id: "root", kind: "group", op: null, not: false, children: [] },
      focusId: "root",
    };
    let treeSeq = 1;
    function nextTreeId() { return "n" + (treeSeq++); }

    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const resultsEl = $("results");
    const moreBtn = $("moreBtn");
    const queryPreview = $("queryPreview");

    function selectedColors() {
      return COLORS.filter((c) => state.colors.has(c));
    }

    const MANA_RGB = {
      W: [248, 246, 216],
      U: [100, 167, 232],
      B: [138, 124, 168],
      R: [224, 106, 85],
      G: [92, 175, 110],
      C: [201, 196, 184],
    };

    function hexFromRgb(rgb) {
      return "#" + rgb.map((n) => Math.max(0, Math.min(255, n)).toString(16).padStart(2, "0")).join("");
    }

    function applyThemeRgb(rgb) {
      const root = document.documentElement;
      const a = hexFromRgb(rgb);
      root.style.setProperty("--accent", a);
      root.style.setProperty("--accent-2", a);
      root.style.setProperty("--accent-glow", "color-mix(in srgb, " + a + " 48%, transparent)");
      root.style.setProperty("--accent-soft", "color-mix(in srgb, " + a + " 20%, #1b212b)");
      root.style.setProperty("--bg", "color-mix(in srgb, " + a + " 8%, #0c0e12)");
      root.style.setProperty("--panel", "color-mix(in srgb, " + a + " 10%, #14181f)");
      root.style.setProperty("--raised", "color-mix(in srgb, " + a + " 12%, #1b212b)");
      root.style.setProperty("--line", "color-mix(in srgb, " + a + " 18%, #2a3140)");
    }

    function themeFromColors() {
      const picks = ALL_COLORS.filter((c) => state.colors.has(c));
      if (!picks.length) {
        applyThemeRgb(MANA_RGB.C);
        return;
      }
      const rgbs = picks.map((c) => MANA_RGB[c]);
      const avg = [0, 1, 2].map((i) => Math.round(rgbs.reduce((s, r) => s + r[i], 0) / rgbs.length));
      applyThemeRgb(avg);
    }

    function identityClause() {
      const colors = selectedColors();
      const colorless = state.colors.has("C");
      if (!colors.length && !colorless) return "";
      if (!colors.length && colorless) {
        if (state.idMode === "exact") return "c=c";
        if (state.idMode === "identity") return "id<=c";
        if (state.idMode === "inside") return "c=c";
        return "c>=c";
      }
      const code = colors.join("").toLowerCase();
      if (state.idMode === "exact") return "c=" + code;
      if (state.idMode === "identity") return "id<=" + code;
      if (state.idMode === "inside") return "c<=" + code + " -c:c";
      return "c>=" + code;
    }


    function typeQuery(t) {
      return String(t).includes(" ") ? 't:"' + t + '"' : "t:" + t;
    }
    function walkTree(node, fn, parent) {
      fn(node, parent);
      if (node.kind === "group") node.children.forEach((ch) => walkTree(ch, fn, node));
    }
    function treeLeaves() {
      const out = [];
      walkTree(state.tree, (n) => { if (n.kind === "leaf") out.push(n); });
      return out;
    }
    function findLeafByQuery(query) {
      return treeLeaves().find((n) => n.query === query) || null;
    }
    function findNode(id, node) {
      const root = node || state.tree;
      if (root.id === id) return root;
      if (root.kind !== "group") return null;
      for (const ch of root.children) {
        const hit = findNode(id, ch);
        if (hit) return hit;
      }
      return null;
    }
    function parentOf(id, node) {
      const root = node || state.tree;
      if (root.kind !== "group") return null;
      if (root.children.some((ch) => ch.id === id)) return root;
      for (const ch of root.children) {
        const hit = parentOf(id, ch);
        if (hit) return hit;
      }
      return null;
    }
    function isSimpleTerm(q) {
      const s = String(q || "").trim();
      return /^[a-z]+:[^\s()]+$/i.test(s) || /^[a-z]+:"[^"]+"$/i.test(s);
    }
    function negateTerm(q) {
      const s = String(q || "").trim();
      if (!s) return "";
      if (s.startsWith("-")) return s;
      if (s.startsWith("(") || !isSimpleTerm(s)) return s.startsWith("(") ? "-" + s : "-(" + s + ")";
      return "-" + s;
    }
    function compileNode(node) {
      if (!node) return "";
      if (node.kind === "leaf") {
        const q = String(node.query || "").trim();
        if (!q) return "";
        return node.not ? negateTerm(q) : q;
      }
      const parts = (node.children || []).map(compileNode).filter(Boolean);
      if (!parts.length) return "";
      if (parts.length === 1) {
        const inner = parts[0];
        return node.not ? negateTerm(inner) : inner;
      }
      let inner;
      if (node.op === "or") inner = "(" + parts.join(" or ") + ")";
      else if (node.op === "and") inner = parts.join(" ");
      else inner = "";
      if (!inner) return "";
      return node.not ? negateTerm(inner) : inner;
    }
    function englishNode(node) {
      if (!node) return "";
      if (node.kind === "leaf") return (node.not ? "not " : "") + node.label;
      const bits = (node.children || []).map(englishNode).filter(Boolean);
      if (!bits.length) return "";
      if (bits.length === 1) return node.not ? "not " + bits[0] : bits[0];
      if (!node.op) return node.not ? "not (" + bits.join(" · ") + ")" : bits.join(" · ");
      const join = node.op === "or" ? " or " : " and ";
      let inner = bits.join(join);
      if (node.id !== "root") inner = "(" + inner + ")";
      return node.not ? "not " + inner : inner;
    }
    function treeClause() { return compileNode(state.tree); }

    function subtypeClause() {
      const raw = ($("subtypeQuery")?.value || "").trim();
      if (!raw) return "";
      const tokens = [];
      const re = /"([^"]+)"|(\S+)/g;
      let m;
      while ((m = re.exec(raw.replace(/,/g, " ")))) {
        tokens.push((m[1] || m[2]).trim());
      }
      const included = [];
      const excluded = [];
      tokens.forEach((tok) => {
        if (!tok) return;
        const neg = tok.startsWith("-") || tok.startsWith("−");
        const name = (neg ? tok.slice(1) : tok).trim().toLowerCase();
        if (!name) return;
        const term = name.includes(" ") || name.includes("'") ? 't:"' + name + '"' : "t:" + name;
        (neg ? excluded : included).push(neg ? "-" + term : term);
      });
      const parts = [];
      if (included.length === 1) parts.push(included[0]);
      else if (included.length > 1) parts.push("(" + included.join(" or ") + ")");
      parts.push(...excluded);
      return parts.join(" ");
    }

    function buildQuery() {
      const parts = ["f:commander", "game:paper"];
      const identity = identityClause();
      if (identity) parts.push(identity);
      const subtypes = subtypeClause();
      if (subtypes) parts.push(subtypes);
      const cmc = cmcClause();
      if (cmc) parts.push(cmc);
      const match = treeClause();
      if (match) parts.push(match);
      return parts.join(" ");
    }

    function cmcIsAny() {
      return state.cmcMin <= 0 && state.cmcMax >= CMC_MAX;
    }

    function cmcClause() {
      if (cmcIsAny()) return "";
      if (state.cmcMin === state.cmcMax) return "cmc=" + state.cmcMin;
      return "cmc>=" + state.cmcMin + " cmc<=" + state.cmcMax;
    }

    function renderCmc() {

    }

    const cmcTickDrag = { from: null };

    function pickCmcTick(n) {
      if (cmcIsAny()) {
        applyCmcWindow(n, n);
        return;
      }
      if (state.cmcMin === state.cmcMax) {
        if (n === state.cmcMin) applyCmcWindow(0, CMC_MAX);
        else applyCmcWindow(Math.min(n, state.cmcMin), Math.max(n, state.cmcMax));
        return;
      }
      applyCmcWindow(n, n);
    }

    function paintTypePalette() {
      document.querySelectorAll("#types .chip").forEach((btn) => {
        const query = typeQuery(btn.dataset.t);

      });
    }

    function togglePaletteLeaf({ label, query, source }) {
      const idx = state.parts.findIndex((p) => p.query === query);
      if (idx >= 0) state.parts.splice(idx, 1);
      else state.parts.push({ id: nextTreeId(), label, query, source });
      renderKeywords();
      updatePreview();
    }

    function selectedInGroup(group) {
      const queries = new Set([...state.parts.map((p) => p.query), ...treeLeaves().map((n) => n.query)]);
      return group.items.filter(([, q]) => queries.has(q)).length;
    }

    function renderKeywords() {
      const root = $("keywords");
      root.innerHTML = "";
      const pads = document.createElement("div");
      pads.className = "kw-pads";
      const panel = document.createElement("div");
      panel.className = "kw-panel";
      const panelTitle = document.createElement("div");

      function paintPads() {
        pads.querySelectorAll(".kw-pad").forEach((btn) => {
          const group = KEYWORD_GROUPS.find((g) => g.label === btn.dataset.group);
          const n = group ? selectedInGroup(group) : 0;
          btn.classList.toggle("on", state.kwOpen === btn.dataset.group);
          btn.classList.toggle("has", n > 0);

          row.innerHTML = "";
          if (sheet) {
            sheet.classList.remove("open");
            sheet.hidden = true;
          }
          paintPads();

        if (mobile && sheet) {

          $("kwSheetTitle").textContent = group.label;
          fillChipRow($("kwSheetBody"), group);
          sheet.hidden = false;
          sheet.classList.add("open");
        } else {

            sheet.classList.remove("open");
            sheet.hidden = true;
          }
          panel.hidden = false;
          panelTitle.textContent = group.label;
          fillChipRow(row, group);
        }
        paintPads();
      }

      KEYWORD_GROUPS.forEach((group) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "kw-pad";
        btn.dataset.group = group.label;

        count.className = "kw-count";

          state.kwOpen = state.kwOpen === group.label ? null : group.label;
          showGroup(group.label);

      root.appendChild(panel);

    }


    function focusedContainer() {
      const node = findNode(state.focusId) || state.tree;
      if (node.kind === "group") return node;
      return parentOf(node.id) || state.tree;
    }
    function containerDepth(node) {
      let d = 0, cur = node;
      while (cur && cur.id !== "root") { d += 1; cur = parentOf(cur.id); }
      return d;
    }
    function placePart(part, dest, index) {
      const box = dest || focusedContainer();
      const at = index == null ? box.children.length : Math.max(0, Math.min(index, box.children.length));
      box.children.splice(at, 0, {
        id: nextTreeId(), kind: "leaf", label: part.label, query: part.query, source: part.source, not: false
      });
      state.focusId = box.id;
      renderKeywords();
      updatePreview();
    }
    function addContainer(op, not, index) {
      const box = focusedContainer();
      if (containerDepth(box) >= 4) return;
      const child = { id: nextTreeId(), kind: "group", op: op || null, not: !!not, children: [] };
      const at = index == null ? box.children.length : Math.max(0, Math.min(index, box.children.length));
      box.children.splice(at, 0, child);
      state.focusId = child.id;
      updatePreview();
    }
    function setJoin(op) {
      const box = focusedContainer();
      box.op = op;
      if (box.id === "root") { state.kwMode = op || "and"; paintKwMode(); }
      updatePreview();
    }
    function wrapParens() {
      const focus = findNode(state.focusId) || state.tree;
      if (focus.kind === "leaf") {
        const parent = parentOf(focus.id);
        if (!parent) return;
        const idx = parent.children.findIndex((ch) => ch.id === focus.id);
        const group = { id: nextTreeId(), kind: "group", op: null, not: false, children: [focus] };
        parent.children.splice(idx, 1, group);
        state.focusId = group.id;
        updatePreview();
        return;
      }
      addContainer(null, false);
    }
    function toggleNegate() {
      const focus = findNode(state.focusId) || state.tree;
      if (focus.kind === "leaf") { focus.not = !focus.not; updatePreview(); return; }
      if (focus.id === "root") { addContainer(null, true); return; }
      focus.not = !focus.not;
      updatePreview();
    }
    function placeAllParts() {
      const box = focusedContainer();
      state.parts.forEach((part) => {
        box.children.push({ id: nextTreeId(), kind: "leaf", label: part.label, query: part.query, source: part.source, not: false });
      });
      renderKeywords();
      updatePreview();
    }
    function removeFocused() {
      const node = findNode(state.focusId);
      if (!node || node.id === "root") return;
      const parent = parentOf(node.id);
      if (!parent) return;
      parent.children = parent.children.filter((ch) => ch.id !== node.id);
      walkTree(node, (n) => {
        if (n.kind !== "leaf") return;
        if (!state.parts.some((p) => p.query === n.query)) {
          state.parts.push({ id: nextTreeId(), label: n.label, query: n.query, source: n.source });
        }
      });
      state.focusId = parent.id;
      renderKeywords();
      updatePreview();
    }
    function isDescendant(ancestor, node) {
      if (!ancestor || !node) return false;
      let found = false;
      walkTree(ancestor, (n) => { if (n.id === node.id && n !== ancestor) found = true; });
      return found;
    }
    function takeNode(id) {
      const parent = parentOf(id);
      if (!parent) return null;
      const idx = parent.children.findIndex((ch) => ch.id === id);
      if (idx < 0) return null;
      return parent.children.splice(idx, 1)[0];
    }
    function returnLeavesToParts(node) {
      walkTree(node, (n) => {
        if (n.kind !== "leaf") return;
        if (!state.parts.some((p) => p.query === n.query)) {
          state.parts.push({ id: nextTreeId(), label: n.label, query: n.query, source: n.source });
        }
      });
    }
    function dropPayload(payload, destId, index) {
      if (!payload) return;
      if (destId === "parts") {
        if (payload.kind === "part" || payload.kind === "expr") return;
        const node = takeNode(payload.id);
        if (node) returnLeavesToParts(node);
        state.focusId = "root";
        renderKeywords();
        updatePreview();
        return;
      }
      const dest = destId === "root" ? state.tree : findNode(destId);
      if (!dest || dest.kind !== "group") return;
      if (payload.kind === "expr") {
        if (payload.expr === "and" || payload.expr === "or") {
          dest.op = payload.expr;
          if (dest.id === "root") { state.kwMode = dest.op; paintKwMode(); }
          state.focusId = dest.id;
          updatePreview();
          return;
        }
        const child = { id: nextTreeId(), kind: "group", op: null, not: payload.expr === "not", children: [] };
        dest.children.splice(Math.max(0, Math.min(index, dest.children.length)), 0, child);
        state.focusId = child.id;
        updatePreview();
        return;
      }
      if (payload.kind === "part") {
        const part = state.parts.find((p) => p.query === payload.query);
        if (!part) return;
        placePart(part, dest, index);
        return;
      }
      const moving = findNode(payload.id);
      if (!moving || moving.id === dest.id || isDescendant(moving, dest)) return;
      const node = takeNode(payload.id);
      if (!node) return;
      dest.children.splice(Math.max(0, Math.min(index, dest.children.length)), 0, node);
      state.focusId = dest.id;
      updatePreview();
    }
    const builderDrag = {

      ignoreClick: false, carry: null, holdTimer: null, pointerId: null

    function clearHold() {
      if (builderDrag.holdTimer) { clearTimeout(builderDrag.holdTimer); builderDrag.holdTimer = null; }
    }
    function dragCleanup(keepCarry) {
      clearHold();
      if (!keepCarry && builderDrag.ghost) builderDrag.ghost.remove();
      if (builderDrag.slot) builderDrag.slot.remove();
      document.querySelectorAll(".drop-on, .is-dragging").forEach((el) => el.classList.remove("drop-on", "is-dragging"));
      builderDrag.on = false; builderDrag.moved = false; builderDrag.payload = null;
      builderDrag.fromEl = null; builderDrag.slot = null; builderDrag.pointerId = null;
      if (!keepCarry) {
        builderDrag.ghost = null;
        builderDrag.carry = null;
        document.body.classList.remove("builder-dragging");
      }
    }
    function liftGhost(label, x, y) {
      if (!builderDrag.ghost) {
        const ghost = document.createElement("div");
        ghost.className = "drag-ghost";
        document.body.appendChild(ghost);
        builderDrag.ghost = ghost;
      }
      builderDrag.ghost.textContent = label || "expr";
      builderDrag.ghost.style.left = x + "px";
      builderDrag.ghost.style.top = y + "px";
    }
    function startLift(payload, fromEl, x, y) {
      builderDrag.moved = true;
      builderDrag.payload = payload;
      if (fromEl) fromEl.classList.add("is-dragging");
      document.body.classList.add("builder-dragging");
      liftGhost(payload.label, x, y);
    }
    function paintDrop(x, y) {
      document.querySelectorAll(".drop-on").forEach((n) => n.classList.remove("drop-on"));
      if (builderDrag.slot) { builderDrag.slot.remove(); builderDrag.slot = null; }
      const drop = currentDrop(x, y);
      if (!drop) return drop;
      drop.el.classList.add("drop-on");
      if (drop.dest !== "parts") {
        const slot = document.createElement("span");
        slot.className = "drop-slot";
        const kids = [...drop.el.querySelectorAll(":scope > [data-node-id]")];
        if (!kids.length || drop.index >= kids.length) drop.el.appendChild(slot);
        else drop.el.insertBefore(slot, kids[drop.index]);
        builderDrag.slot = slot;
      }
      return drop;
    }
    function dropIndexFor(container, x) {
      const kids = [...container.querySelectorAll(":scope > [data-node-id]")];
      for (let i = 0; i < kids.length; i++) {
        const r = kids[i].getBoundingClientRect();
        if (x < r.left + r.width / 2) return i;
      }
      return kids.length;
    }
    function currentDrop(x, y) {
      const stack = document.elementsFromPoint(x, y);
      const hit = stack.find((n) => n.dataset && n.dataset.drop);
      if (!hit) return null;
      return { el: hit, dest: hit.dataset.drop, index: hit.dataset.drop === "parts" ? 0 : dropIndexFor(hit, x) };
    }
    function bindBuilderDrag(el, payload) {
      el.style.cursor = "grab";
      el.addEventListener("pointerdown", (e) => {
        if (e.button && e.button !== 0) return;
        if (e.target.closest(".mini")) return;
        if (builderDrag.carry) return;
        clearHold();

        builderDrag.moved = false;
        builderDrag.payload = payload;
        builderDrag.fromEl = el;
        builderDrag.startX = e.clientX;
        builderDrag.startY = e.clientY;
        builderDrag.pointerId = e.pointerId;
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        builderDrag.holdTimer = setTimeout(() => {
          if (!builderDrag.on || builderDrag.moved) return;
          startLift(payload, el, e.clientX, e.clientY);

      });
    }
    function onDragMove(e) {
      if ((!builderDrag.on && !builderDrag.carry) || (!builderDrag.payload && !builderDrag.carry)) return;
      const x = e.clientX, y = e.clientY;

    const cmcDrag = { active: false, axis: null, x: 0, y: 0, min: 0, max: 15 };

    function applyCmcWindow(min, max) {
      min = Math.max(0, Math.min(CMC_MAX, Math.round(min)));
      max = Math.max(0, Math.min(CMC_MAX, Math.round(max)));
      if (min > max) {
        const t = min;
        min = max;
        max = t;

      state.cmcMin = min;
      state.cmcMax = max;

    function bindCmcPad() {
      const pad = $("cmcPad");
      const stepX = () => {
        const rail = pad.querySelector(".cmc-rail");
        return Math.max(12, (rail.clientWidth || pad.clientWidth - 28) / CMC_MAX);
      };
      const stepY = 26;

      pad.addEventListener("pointerdown", (e) => {
        pad.setPointerCapture(e.pointerId);
        pad.classList.add("held");
        cmcDrag.active = true;
        cmcDrag.axis = null;
        cmcDrag.x = e.clientX;
        cmcDrag.y = e.clientY;
        cmcDrag.min = state.cmcMin;
        cmcDrag.max = state.cmcMax;
      });
      pad.addEventListener("pointermove", (e) => {
        if (!cmcDrag.active) return;
        const dx = e.clientX - cmcDrag.x;
        const dy = e.clientY - cmcDrag.y;
        if (!cmcDrag.axis) {
          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
          cmcDrag.axis = Math.abs(dx) >= Math.abs(dy) ? "x" : "y";
        }
        const startWidth = cmcDrag.max - cmcDrag.min + 1;
        const startMid = (cmcDrag.min + cmcDrag.max) / 2;
        let width = startWidth;
        let mid = startMid;
        if (cmcDrag.axis === "y") {
          width = Math.max(1, Math.min(CMC_MAX + 1, startWidth + Math.round(-dy / stepY)));
        } else {
          mid = startMid + Math.round(dx / stepX());
        }
        let start = Math.round(mid - (width - 1) / 2);
        start = Math.max(0, Math.min(CMC_MAX + 1 - width, start));
        applyCmcWindow(start, start + width - 1);
      });
      const endDrag = (e) => {
        if (!cmcDrag.active) return;
        cmcDrag.active = false;
        cmcDrag.axis = null;
        pad.classList.remove("held");
        if (e && pad.hasPointerCapture?.(e.pointerId)) pad.releasePointerCapture(e.pointerId);
      };
      pad.addEventListener("pointerup", endDrag);
      pad.addEventListener("pointercancel", endDrag);
    }

    async function search(reset) {
      const q = buildQuery();
      const unique = $("unique").value;
      const sort = $("sort").value;
      let url;
      if (reset) {
        url = "https://api.scryfall.com/cards/search?" + new URLSearchParams({
          q,
          unique,
          order: sort,
          dir: sort === "edhrec" || sort === "usd" || sort === "cmc" ? "asc" : "auto",
        });
        state.shown = 0;
        state.total = 0;
        state.next = null;
        moreBtn.hidden = true;
      } else {
        url = state.next;
        if (!url) return;
      }

      $("searchBtn").disabled = true;
      moreBtn.disabled = true;
      setStatus(reset ? "Searching Scryfall…" : "Loading more…");

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) {
          const err = new Error(data.details || data.code || "Search failed");
          err.code = data.code;
          throw err;
        }
        const cards = data.data || [];
        if (!cards.length) {
          showEmptyResults("none");
          setStatus("0 cards");
          moreBtn.hidden = true;
          return;
        }
        state.total = data.total_cards || cards.length;
        state.shown += cards.length;
        state.next = data.has_more ? data.next_page : null;
        renderCards(cards, !reset);
        moreBtn.hidden = !state.next;
        const colorNote = identityClause() || "any colors";
        setStatus(state.shown + " of " + state.total.toLocaleString() + " cards · " + colorNote);
      } catch (err) {
        if (reset) showEmptyResults(err.code === "not_found" ? "none" : "error", err.message);
        setStatus(err.code === "not_found" ? "0 cards" : (err.message || "Search failed"), err.code !== "not_found");
        moreBtn.hidden = true;
      } finally {
        $("searchBtn").disabled = false;
        moreBtn.disabled = false;
      }
    }

    function kwQuery(name) {
      const key = String(name).toLowerCase();
      const quoted = /[\s\-!]/.test(key);
      const kw = quoted ? 'kw:"' + key + '"' : "kw:" + key;
      const oracle = quoted ? 'o:"' + key + '"' : "o:" + key;
      return "(" + kw + " or " + oracle + ")";
    }

    function usedKeywordNames() {
      const used = new Set();
      KEYWORD_GROUPS.forEach((group) => {
        group.items.forEach(([, q]) => {
          const m = String(q).match(/kw:"?([^" )]+)"?/i);
          if (m) used.add(m[1].toLowerCase());
        });
      });
      return used;
    }

    function addUniqueItem(group, name, query) {
      const key = name.toLowerCase();
      if (group.items.some(([n]) => n.toLowerCase() === key)) return;
      group.items.push([name, query]);
    }

    async function hydrateCatalogs() {
      try {
        const headers = { Accept: "application/json" };
        const [kwRes, awRes] = await Promise.all([
          fetch("https://api.scryfall.com/catalog/keyword-abilities", { headers }),
          fetch("https://api.scryfall.com/catalog/ability-words", { headers }),
        ]);
        const kw = kwRes.ok ? await kwRes.json() : { data: [] };
        const aw = awRes.ok ? await awRes.json() : { data: [] };
        const skipKeywords = new Set(["affinitycycling"]);
        const used = usedKeywordNames();
        const byLabel = Object.fromEntries(KEYWORD_GROUPS.map((g) => [g.label, g]));
        (kw.data || []).forEach((name) => {
          const key = String(name).toLowerCase();
          if (skipKeywords.has(key) || used.has(key)) return;
          const label = categorizeKeyword(name);
          const group = byLabel[label] || byLabel["Engines"];
          addUniqueItem(group, name, kwQuery(name));
          used.add(String(name).toLowerCase());
        });
        const awGroup = byLabel["Ability words"];
        if (awGroup && aw.data?.length) {
          aw.data.forEach((name) => addUniqueItem(awGroup, name, kwQuery(name)));
          const pinned = new Set(["landfall","magecraft","constellation","morbid","metalcraft","threshold","delirium","raid","battalion","revolt","eminence","undergrowth","coven","alliance","valiant","enrage"]);
          awGroup.items.sort((a, b) => {
            const ap = pinned.has(a[0].toLowerCase()) ? 0 : 1;
            const bp = pinned.has(b[0].toLowerCase()) ? 0 : 1;
            return ap - bp || a[0].localeCompare(b[0]);
          });
        }
        KEYWORD_GROUPS.forEach((group) => {
          const roles = (ROLE_ITEMS[group.label] || []).map(([n]) => n.toLowerCase());
          const head = group.items.filter(([n]) => roles.includes(n.toLowerCase()));
          const rest = group.items.filter(([n]) => !roles.includes(n.toLowerCase()))
            .sort((a, b) => a[0].localeCompare(b[0]));
          group.items = head.concat(rest);
        });
        renderKeywords();
      } catch (_) {
        /* keep curated lists offline */
      }
    }

    renderKeywords();
    renderCmc();
    paintKwMode();
    paintIdMode();
    themeFromColors();
    updatePreview();
    hydrateCatalogs();
  </script>
</body>
</html>
